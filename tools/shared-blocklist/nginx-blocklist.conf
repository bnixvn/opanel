# blocklist.bnix.io.vn, served by GitLab's bundled nginx (included from
# gitlab.rb: nginx['custom_nginx_config']). The list itself is a static file;
# only registration, reports and the admin page reach the collector.
limit_req_zone $binary_remote_addr zone=bbl_register:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=bbl_api:5m rate=60r/m;

server {
  listen 80;
  server_name blocklist.bnix.io.vn;
  location /.well-known/acme-challenge/ { root /var/www/bnix-blocklist-acme; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name blocklist.bnix.io.vn;
  ssl_certificate /etc/letsencrypt/live/blocklist.bnix.io.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/blocklist.bnix.io.vn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 256k;
  add_header X-Content-Type-Options nosniff always;

  location = / { default_type text/plain; return 200 "BNIX shared blocklist. The list: https://blocklist.bnix.io.vn/v1/blocklist.txt\n"; }

  location = /v1/blocklist.txt { alias /var/lib/bnix-blocklist/public/blocklist.txt; default_type text/plain; add_header Cache-Control "public, max-age=60"; }
  location = /v1/blocklist-v4.txt { alias /var/lib/bnix-blocklist/public/blocklist-v4.txt; default_type text/plain; add_header Cache-Control "public, max-age=60"; }

  location = /v1/register {
    limit_req zone=bbl_register burst=3 nodelay;
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /v1/ {
    limit_req zone=bbl_api burst=30 nodelay;
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /admin {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location / { return 404; }
}
